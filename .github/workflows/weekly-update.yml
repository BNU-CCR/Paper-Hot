name: Weekly paper update

on:
  schedule:
    - cron: "0 13 * * 1"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      limit_per_journal:
        description: Maximum papers fetched from each journal
        required: true
        default: "100"
      screen_limit:
        description: Papers screened in each AI batch
        required: true
        default: "50"
      max_screen_batches:
        description: Maximum AI batches in this run
        required: true
        default: "10"
      skip_coverage:
        description: Skip the Crossref coverage check
        type: boolean
        required: true
        default: false
      commit_public_data:
        description: Commit refreshed public JSON to main
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: paper-hot-weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      AI_MODEL: ${{ vars.AI_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore the latest working database
        uses: actions/cache/restore@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            paper-hot-db-${{ runner.os }}-

      - name: Record whether cloud state was restored
        id: database-state
        run: |
          if [ -f backend/data/papers.db ]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install package
        run: python -m pip install -e .

      - name: Check required configuration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Missing repository secret: ANTHROPIC_API_KEY" >&2
            exit 1
          fi
          journal-tracker doctor

      - name: Run journal-first weekly workflow
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          args=(
            weekly-run
            --limit-per-journal "${{ inputs.limit_per_journal || '100' }}"
            --screen-limit "${{ inputs.screen_limit || '50' }}"
            --max-screen-batches "${{ inputs.max_screen_batches || '10' }}"
            --refilter-limit 10
          )
          if [ "${{ inputs.skip_coverage || 'false' }}" = "true" ]; then
            args+=(--skip-coverage)
          fi
          journal-tracker "${args[@]}"

      - name: Validate generated public data
        run: |
          python -m journal_tracker.readme_update
          python -m json.tool frontend/public/data/papers.json >/dev/null
          python -m json.tool frontend/public/data/all_papers.json >/dev/null
          node frontend/web/app.test.cjs

      - name: Save the updated working database
        uses: actions/cache/save@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}

      - name: Upload run report and public data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-hot-weekly-${{ github.run_id }}
          path: |
            backend/data/reports/*.json
            frontend/public/data/*.json
            README.md
          if-no-files-found: warn
          retention-days: 30

      - name: Commit refreshed public data
        if: >-
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'schedule' && steps.database-state.outputs.restored == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.commit_public_data == true))
        run: |
          git add README.md frontend/public/data/papers.json frontend/public/data/all_papers.json
          if git diff --cached --quiet; then
            echo "No public data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh weekly paper feed"
          git push origin HEAD:main
