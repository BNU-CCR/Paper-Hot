name: Sanitize paper titles

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-hot-weekly-update
  cancel-in-progress: false

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore the latest working database
        uses: actions/cache/restore@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            paper-hot-db-${{ runner.os }}-

      - name: Require a restored database
        run: test -f backend/data/papers.db

      - name: Install package
        run: python -m pip install -e .

      - name: Sanitize stored titles and export public data
        run: |
          journal-tracker sanitize-titles
          journal-tracker export-public
          python -m journal_tracker.readme_update

      - name: Validate generated public data
        run: |
          python -m json.tool frontend/public/data/papers.json >/dev/null
          python -m json.tool frontend/public/data/all_papers.json >/dev/null

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build static Next.js site
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
          test -f frontend/out/index.html
          test -f frontend/out/data/papers.json
          test -f frontend/out/data/all_papers.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - name: Deploy sanitized public site
        uses: actions/deploy-pages@v4

      - name: Save the sanitized working database
        uses: actions/cache/save@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}

      - name: Commit refreshed public data
        run: |
          git add README.md frontend/public/data/papers.json frontend/public/data/all_papers.json
          if git diff --cached --quiet; then
            echo "No public data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): sanitize paper titles"
          git push origin HEAD:main
