name: Rebuild hotspot network

# Regenerate the hotspot semantic-map data (frontend/public/data/hotspots/) from
# the cached working database and redeploy the static site. Use this after
# changing hotspot pipeline code — the committed hotspots data is a build
# artifact, not source, and is only refreshed here or by the weekly-update run.
#
# Unlike weekly-update.yml this does NOT fetch or screen papers; it only
# re-runs build-hotspot-network on the current database.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-hot-hotspot-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      AI_MODEL: ${{ vars.AI_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore the latest working database
        uses: actions/cache/restore@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            paper-hot-db-${{ runner.os }}-

      - name: Restore FastEmbed model cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5-v1

      - name: Install package with analysis extras
        run: python -m pip install -e ".[analysis]"

      - name: Check required configuration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || (echo "Missing repository secret: ANTHROPIC_API_KEY" >&2; exit 1)

      - name: Build hotspot network data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          journal-tracker build-hotspot-network \
            --analysis-days 180 \
            --recent-days 30 \
            --baseline-days 150 \
            --max-topics 40

      - name: Validate hotspot network output
        run: |
          journal-tracker validate-hotspot-data

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build static Next.js site
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
          test -f frontend/out/data/hotspots/graph.json
          test -f frontend/out/data/hotspots/trends.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - name: Deploy refreshed public site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save FastEmbed model cache
        uses: actions/cache/save@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5-v1

      - name: Save the updated working database
        uses: actions/cache/save@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}

      - name: Commit refreshed hotspot data
        run: |
          git add frontend/public/data/hotspots/
          if git diff --cached --quiet; then
            echo "No hotspot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): rebuild hotspot network"
          git push origin HEAD:main
