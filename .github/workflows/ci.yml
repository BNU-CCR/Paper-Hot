name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run Python tests
        run: python -m unittest discover backend/tests -v
      - name: Smoke-test a fresh local database
        run: journal-tracker workflow-status

  analysis-tests:
    name: Hotspot analysis pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with analysis extras
        run: python -m pip install -e ".[analysis]"
      - name: Run hotspot network / validation / features tests
        run: python -m unittest backend/tests/test_hotspot_network.py backend/tests/test_hotspot_validation.py backend/tests/test_paper_features.py -v
      - name: Smoke-test the hotspot CLI against a fresh database
        run: |
          # Empty DB → the CLI must exit 0 (graceful no-candidates skip)
          journal-tracker build-hotspot-network --max-topics 40
          journal-tracker validate-hotspot-data

  frontend-tests:
    name: Next.js frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Build static Next.js site
        run: pnpm --dir frontend build
      - name: Verify Pages files
        run: |
          test -f frontend/out/index.html
          test -f frontend/out/about/index.html
          test -f frontend/out/data/papers.json
          test -f frontend/out/data/all_papers.json
