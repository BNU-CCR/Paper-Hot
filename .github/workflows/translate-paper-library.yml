name: Translate paper library

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum missing or stale papers to translate
        required: true
        default: "10000"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-hot-weekly-update
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore the latest working database
        uses: actions/cache/restore@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            paper-hot-db-${{ runner.os }}-
      - name: Require cloud database and SiliconFlow key
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          test -f backend/data/papers.db
          test -n "$SILICONFLOW_API_KEY" || (echo "Missing repository secret: SILICONFLOW_API_KEY" >&2; exit 1)
      - name: Install package
        run: python -m pip install -e .
      - name: Translate titles and abstracts
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          journal-tracker translate-papers --limit "${{ inputs.limit }}"
          journal-tracker export-public
          python -m journal_tracker.readme_update
      - name: Save translation checkpoints
        uses: actions/cache/save@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}
      - name: Validate public JSON
        run: |
          python -m json.tool frontend/public/data/papers.json >/dev/null
          python -m json.tool frontend/public/data/all_papers.json >/dev/null
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build static site
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
          test -f frontend/out/data/papers.json
          test -f frontend/out/data/all_papers.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
      - name: Deploy translated site
        uses: actions/deploy-pages@v4
      - name: Commit translated public data
        run: |
          git add README.md frontend/public/data/papers.json frontend/public/data/all_papers.json
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): translate paper library"
          git push origin HEAD:main
