name: Backfill OpenAlex features

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum records to enrich from OpenAlex
        required: true
        default: "10000"
      commit_public_data:
        description: Commit refreshed public JSON to main
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-hot-features-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore the latest working database
        uses: actions/cache/restore@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            paper-hot-db-${{ runner.os }}-

      - name: Install package
        run: python -m pip install -e .

      - name: Backfill topics, keywords, references, and citations from OpenAlex
        run: journal-tracker backfill-features --limit "${{ inputs.limit }}"

      - name: Refresh public data
        run: |
          journal-tracker export-public
          python -m journal_tracker.readme_update
          python -m json.tool frontend/public/data/papers.json >/dev/null
          python -m json.tool frontend/public/data/all_papers.json >/dev/null

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build static Next.js site
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
          test -f frontend/out/index.html
          test -f frontend/out/data/papers.json
          test -f frontend/out/data/all_papers.json

      - uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - name: Deploy refreshed public site
        uses: actions/deploy-pages@v4

      - name: Save the updated working database
        uses: actions/cache/save@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}

      - name: Commit refreshed public data
        if: inputs.commit_public_data == true
        run: |
          git add README.md frontend/public/data/papers.json frontend/public/data/all_papers.json
          if git diff --cached --quiet; then
            echo "No public data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): backfill OpenAlex features (topics, keywords, references)"
          git push origin HEAD:main
