name: Enrich author identities and affiliations

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum DOI-bearing papers to process
        required: true
        default: "50"
      force:
        description: Reprocess papers that already have author enrichment
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: paper-hot-weekly-update
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    # Anonymous Semantic Scholar requests can require long 429 backoff waits.
    # GitHub-hosted jobs allow up to 360 minutes, so keep enough room for a
    # bounded batch to finish and reach the database cache-save step.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore the latest working database
        uses: actions/cache/restore@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            paper-hot-db-${{ runner.os }}-
      - name: Require cloud database
        run: test -f backend/data/papers.db
      - name: Install package
        run: python -m pip install -e .
      - name: Enrich author identities and affiliations
        id: enrichment
        timeout-minutes: 300
        continue-on-error: true
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          args=(
            enrich-authors
            --limit "${{ inputs.limit }}"
            --report backend/data/reports/author_enrichment_latest.json
          )
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          journal-tracker "${args[@]}"
      - name: Export checkpointed public data
        if: always()
        run: journal-tracker export-public
      - name: Save enriched database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}
      - name: Upload pilot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: author-enrichment-report-${{ github.run_id }}
          path: backend/data/reports/author_enrichment_latest.json
          if-no-files-found: warn
          retention-days: 30
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build static site
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
          test -f frontend/out/data/papers.json
          test -f frontend/out/data/all_papers.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
      - name: Deploy enriched site
        uses: actions/deploy-pages@v4
      - name: Commit enriched public data
        run: |
          git add frontend/public/data/papers.json frontend/public/data/all_papers.json
          if git diff --cached --quiet; then
            echo "No author enrichment export changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): export author institutions"
          git push origin HEAD:main
      - name: Report incomplete enrichment
        if: always() && steps.enrichment.outcome != 'success'
        run: |
          echo "Author enrichment did not finish, but checkpointed database and public data were preserved."
          exit 1
