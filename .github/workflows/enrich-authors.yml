name: Enrich author identities and affiliations

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum DOI-bearing papers to process
        required: true
        default: "25"
      force:
        description: Reprocess papers that already have author enrichment
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: paper-hot-weekly-update
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore the latest working database
        uses: actions/cache/restore@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            paper-hot-db-${{ runner.os }}-
      - name: Require cloud database
        run: test -f backend/data/papers.db
      - name: Install package
        run: python -m pip install -e .
      - name: Enrich author identities and affiliations
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          args=(
            enrich-authors
            --limit "${{ inputs.limit }}"
            --report backend/data/reports/author_enrichment_latest.json
          )
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          journal-tracker "${args[@]}"
      - name: Save enriched database
        uses: actions/cache/save@v4
        with:
          path: backend/data/papers.db
          key: paper-hot-db-${{ runner.os }}-${{ github.run_id }}
      - name: Upload pilot report
        uses: actions/upload-artifact@v4
        with:
          name: author-enrichment-report-${{ github.run_id }}
          path: backend/data/reports/author_enrichment_latest.json
          if-no-files-found: error
          retention-days: 30
