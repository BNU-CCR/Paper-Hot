[project]
name = "journal-tracker"
version = "0.1.0"
description = "计算传播论文追踪系统 - 用AI自动追踪和筛选领域论文"
authors = [{name = "User"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.18.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
analysis = [
    "fastembed>=0.8,<0.9",
    "numpy>=2,<3",
    "scikit-learn>=1.7,<2",
    "scipy>=1.13,<2",
    "igraph>=1,<2",
    "umap-learn>=0.5,<0.7",
]

[project.scripts]
journal-tracker = "journal_tracker.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["journal_tracker*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
