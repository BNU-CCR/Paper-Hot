# 全局设置
# 注意：敏感信息（如API Key）应通过环境变量设置

# Anthropic 兼容 API 配置
# 当前默认使用 DeepSeek 的 Anthropic 兼容接口。
# API Key 建议通过 .env 或环境变量 ANTHROPIC_API_KEY 设置。
anthropic_api_key: ""
anthropic_base_url: "https://api.deepseek.com/anthropic"

# AI 筛选模型配置
claude_model: "deepseek-v4-flash"
max_tokens: 500

# Semantic Scholar API (可选)
semantic_scholar_api_key: ""

# 通知配置
notification:
  enable_wechat: false
  enable_email: false
  email_to: ""

  # Server酱配置
  serverchan_sckey: ""  # 通过环境变量 SERVERCHAN_SCKEY 设置

# 追踪设置
tracking:
  # 每次运行最大处理论文数
  max_papers_per_run: 20

  # 搜索时间范围（天数）
  search_days_back: 7

  # 是否启用去重
  enable_dedup: true

  # 筛选阈值（只处理 High 和 Medium）
  relevance_threshold: "Medium"

# 数据库设置
database:
  # SQLite 数据库路径（相对于项目根目录）
  path: "data/papers.db"

# 定时任务设置
scheduler:
  # 是否启用定时任务
  enabled: false

  # cron 表达式（本地运行时使用）
  # 默认每天上午9点运行
  cron: "0 9 * * *"

# 日志设置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
