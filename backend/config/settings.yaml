# 全局设置
# 注意：敏感信息（如API Key）应通过环境变量设置

# Anthropic 兼容 API 配置
# 当前默认使用 DeepSeek 的 Anthropic 兼容接口。
# API Key 建议通过 .env 或环境变量 ANTHROPIC_API_KEY 设置。
anthropic_api_key: ""
anthropic_base_url: "https://api.deepseek.com/anthropic"

# AI 筛选模型配置
claude_model: "deepseek-v4-flash"
max_tokens: 500

# Semantic Scholar API (可选)
semantic_scholar_api_key: ""

# SiliconFlow translation API. Keep the key in GitHub Secret SILICONFLOW_API_KEY.
translation:
  base_url: "https://api.siliconflow.cn/v1"
  model: "tencent/Hunyuan-MT-7B"
  # L0 is 80K TPM; stay below it to leave room for accounting differences.
  token_budget_per_minute: 60000
  max_retries: 6

# 通知配置
notification:
  enable_wechat: false
  enable_email: false
  email_to: ""

  # Server酱配置
  serverchan_sckey: ""  # 通过环境变量 SERVERCHAN_SCKEY 设置

# 追踪设置
tracking:
  # 每次运行最大处理论文数
  max_papers_per_run: 20

  # 搜索时间范围（天数）
  search_days_back: 7

  # 是否启用去重
  enable_dedup: true

  # 筛选阈值（只处理 High 和 Medium）
  relevance_threshold: "Medium"

# 数据库设置
database:
  # SQLite 数据库路径（相对于项目根目录）
  path: "data/papers.db"

# 定时任务设置
scheduler:
  # 是否启用定时任务
  enabled: false

  # cron 表达式（本地运行时使用）
  # 默认每天上午9点运行
  cron: "0 9 * * *"

# 日志设置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# OpenAlex API key (optional but recommended for higher rate limits)
openalex_api_key: ""

# 热点网络构建参数
hotspot_network:
  analysis_days: 180
  recent_days: 30
  baseline_days: 150
  embedding_model: "BAAI/bge-small-en-v1.5"
  knn_k: 8
  minimum_semantic_similarity: 0.42
  minimum_edge_weight: 0.45
  semantic_weight: 0.70
  topic_weight: 0.20
  reference_weight: 0.10
  leiden_resolution: 0.8
  leiden_iterations: 4
  topic_match_threshold: 0.72
  topic_drift_threshold: 0.55
  min_recent_papers_for_hot: 3
  # 进入热点主图的最低近 30 天论文数（低于此值的主题不进入主图，保留在 topics_meta 供血缘）
  min_recent_papers_for_display: 2
  # 聚类可靠性的最小主题总论文数（近 180 天窗口内）
  min_total_papers_for_cluster: 4
  # 是否把近 30 天 <=1 篇的潜在议题也画进主图（默认否）
  include_inactive_topics: false
  max_topics: 40
  # 语义地图坐标：论文 embedding 的 UMAP 二维降维参数
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  umap_seed: 42
